<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SSC CGL Exam Platform</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      var segment = window.location.pathname.split('/')[1];
      var knownRoutes = ['notes', 'library', 'practice', 'mistakes', 'bookmarks', 'analytics', 'studio', 'import', 'exam', 'results', 'review', 'dashboard'];
      var isRepoSubpath = segment && !knownRoutes.includes(segment);
      var pathSegmentsToKeep = isRepoSubpath ? 1 : 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
